services:
  db:
    image: postgres:18
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: .
    environment:
      - DATABASE_URL=${DB_URL}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
volumes:
  pgdata:
